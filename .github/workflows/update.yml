name: 수집·배포
on:
  schedule:
    - cron: '17 */2 * * *'   # 2시간마다 (KST 기준 매 홀수시 17분)
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write   # debug-snapshots 브랜치 저장용
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # 수집이 멈춰도 20분 뒤 끝내서 다음 배포를 막지 않음
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 직전 수집분 복원(사이트 실패 대비)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw.json
            data/tr-cache.json
            data/seen.json
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run scrape
      # 0건 사이트 화면을 debug-snapshots 브랜치에 덮어씀(커밋 1개만 유지).
      # 아티팩트는 외부 저장소 주소라 클라우드 점검 세션에서 못 받아서, GitHub API로 읽을 수 있는 브랜치에 둠
      - name: 0건 사이트 화면 저장(원격 점검용)
        if: always() && hashFiles('debug/*') != ''
        continue-on-error: true
        working-directory: debug
        run: |
          git init -q -b debug-snapshots
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -q -m "0건 사이트 화면 ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" debug-snapshots
      - run: node scripts/translate.mjs
        env:
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
      - run: npm run build
      - uses: actions/cache/save@v4
        with:
          path: |
            data/raw.json
            data/tr-cache.json
            data/seen.json
          key: raw-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
