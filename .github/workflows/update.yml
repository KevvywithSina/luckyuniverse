name: 수집·배포
on:
  schedule:
    - cron: '17 */2 * * *'   # 2시간마다 (KST 기준 매 홀수시 17분)
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 직전 수집분 복원(사이트 실패 대비)
        uses: actions/cache/restore@v4
        with:
          path: data/raw.json
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - run: npm install --no-audit --no-fund
      - run: npm run scrape
      - run: npm run build
      - uses: actions/cache/save@v4
        with:
          path: data/raw.json
          key: raw-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
